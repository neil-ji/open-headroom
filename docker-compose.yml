# =============================================================================
# Headroom — full "memory stack" compose with blue-green reverse proxy
# =============================================================================
# Brings up Caddy as the front-door reverse proxy in front of two Headroom
# proxy instances (blue / green). The deploy script (scripts/deploy.sh)
# orchestrates zero-downtime blue-green deployments.
#
# Quick start:
#   1. cp .env.example .env   # then set NEO4J_AUTH, defaults to ACTIVE_COLOR=blue
#   2. docker compose up -d
#   3. point your LLM client at http://localhost:8787  (Caddy → active instance)
#
# Ports exposed on the host:
#   8787  Caddy reverse proxy (OpenAI-compatible endpoint)
#   8788  headroom-blue  (internal — direct access for health checks)
#   8789  headroom-green (internal — direct access for health checks)
#   6333  Qdrant REST   6334  Qdrant gRPC
#   7474  Neo4j Browser 7687  Neo4j Bolt
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Caddy — reverse proxy for blue-green routing
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: headroom-caddy
    ports:
      - "8787:8787"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    environment:
      - ACTIVE_COLOR=${ACTIVE_COLOR:-blue}
    networks:
      - headroom-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Headroom proxy — Blue instance (default active)
  # ---------------------------------------------------------------------------
  headroom-blue:
    build:
      context: .
      args:
        HEADROOM_BUILD_VERSION: ${HEADROOM_BUILD_VERSION:-source-build}
    container_name: headroom-blue
    command: ["--host", "0.0.0.0"]
    environment:
      - HEADROOM_HOST=0.0.0.0
      - HOME=/home/nonroot
      # Keep all Headroom read/write state on the named volume below.
      - HEADROOM_WORKSPACE_DIR=/home/nonroot/.headroom
      - HEADROOM_CONFIG_DIR=/home/nonroot/.headroom/config
      # Trust Docker bridge gateway IPs so loopback-gated endpoints
      # (/dashboard/settings, /debug/*, /admin/*) are reachable from
      # the host browser through Caddy.  172.16.0.0/12 covers all
      # standard Docker bridge networks.
      - HEADROOM_PROXY_TRUSTED_GATEWAY_CIDRS=172.16.0.0/12
      # Route Anthropic-format requests to DeepSeek (or any compatible API).
      - ANTHROPIC_TARGET_API_URL=https://api.deepseek.com/anthropic
    ports:
      - "8788:8787"   # Internal — Caddy routes here via hostname
    volumes:
      - headroom_workspace:/home/nonroot/.headroom
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - qdrant
      - neo4j
    networks:
      - headroom-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Headroom proxy — Green instance (standby)
  # ---------------------------------------------------------------------------
  headroom-green:
    build:
      context: .
      args:
        HEADROOM_BUILD_VERSION: ${HEADROOM_BUILD_VERSION:-source-build}
    container_name: headroom-green
    command: ["--host", "0.0.0.0"]
    environment:
      - HEADROOM_HOST=0.0.0.0
      - HOME=/home/nonroot
      - HEADROOM_WORKSPACE_DIR=/home/nonroot/.headroom
      - HEADROOM_CONFIG_DIR=/home/nonroot/.headroom/config
      - HEADROOM_PROXY_TRUSTED_GATEWAY_CIDRS=172.16.0.0/12
    ports:
      - "8789:8787"   # Internal — Caddy routes here via hostname
    volumes:
      - headroom_workspace:/home/nonroot/.headroom
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - qdrant
      - neo4j
    networks:
      - headroom-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Vector database for semantic search.
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.17.1
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  # ---------------------------------------------------------------------------
  # Graph database for relationships and multi-hop reasoning.
  # ---------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.26
    ports:
      - "7474:7474"  # HTTP (Browser)
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/devpassword}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true

# ---------------------------------------------------------------------------
# Named volumes
# ---------------------------------------------------------------------------
volumes:
  headroom_workspace:    # persists dashboard savings/history, logs, config
  qdrant_data:
  neo4j_data:
  caddy_data:            # Caddy runtime data (TLS certs, OCSP staples)

networks:
  headroom-net:
    driver: bridge
