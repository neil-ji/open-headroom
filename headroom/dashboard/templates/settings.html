<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Headroom Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700&family=JetBrains+Mono:ital,wght@0,400;0,500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.13.3/dist/cdn.min.js" defer></script>
    <script>
        (function () {
            const saved = localStorage.getItem('headroom-theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (saved === 'light' || (!saved && !prefersDark)) {
                document.documentElement.classList.remove('dark');
            } else {
                document.documentElement.classList.add('dark');
            }
        })();
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        display: ['"DM Sans"', 'system-ui', 'sans-serif'],
                        body: ['"DM Sans"', 'system-ui', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
                    },
                    colors: {
                        surface: 'var(--color-surface)',
                        border: 'var(--color-border)',
                        accent: 'var(--color-accent)',
                    }
                }
            }
        };
    </script>
    <style>
        /* ── Design Tokens ── */
        :root {
            --color-bg: #F5F3EF;
            --color-surface: #FFFFFF;
            --color-surface-alt: #FAF9F6;
            --color-border: #E8E4DC;
            --color-text: #1E1B18;
            --color-text-secondary: #78746D;
            --color-text-muted: #9D9890;
            --color-accent: #C86E2C;
            --color-accent-soft: rgba(200, 110, 44, 0.08);
            --color-positive: #3D8B7E;
            --color-negative: #C44E4E;
            --color-warning: #C88A2C;
            --color-warning-soft: rgba(200, 138, 44, 0.10);
            --radius-sm: 6px;
            --radius-md: 10px;
            --shadow-card: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.04);
        }
        html.dark {
            --color-bg: #141310;
            --color-surface: #1C1A16;
            --color-surface-alt: #22201B;
            --color-border: #2D2A24;
            --color-text: #EBE7DE;
            --color-text-secondary: #8B877B;
            --color-text-muted: #6B675E;
            --color-accent: #E8A048;
            --color-accent-soft: rgba(232, 160, 72, 0.10);
            --color-positive: #5BAF9D;
            --color-negative: #D4695A;
            --color-warning: #E0A840;
            --color-warning-soft: rgba(224, 168, 64, 0.10);
            --shadow-card: 0 1px 3px rgba(0,0,0,0.25), 0 1px 2px rgba(0,0,0,0.15);
        }

        body {
            background: var(--color-bg);
            color: var(--color-text);
            font-family: 'DM Sans', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-card);
        }

        .glass-header {
            background: rgba(255,255,255,0.72);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(0,0,0,0.06);
        }
        html.dark .glass-header {
            background: rgba(28,26,22,0.78);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .field-help { color: var(--color-text-secondary); }

        input, select, textarea {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            color: var(--color-text);
            font-family: inherit;
        }
        input:disabled, select:disabled { opacity: .55; cursor: not-allowed; }
        input:focus, select:focus, textarea:focus {
            outline: 2px solid var(--color-accent);
            outline-offset: 1px;
            border-color: var(--color-accent);
        }

        .tab-btn {
            padding: 0.375rem 0.875rem;
            font-size: 0.8125rem;
            border-radius: var(--radius-sm);
            transition: all 0.15s ease;
            font-weight: 500;
        }
        .tab-btn.active {
            background: var(--color-accent);
            color: #fff;
        }
        .tab-btn:not(.active) {
            color: var(--color-text-secondary);
        }
        .tab-btn:not(.active):hover {
            color: var(--color-text);
            background: var(--color-surface-alt);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 3px; }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
<script>
// --- I18N (shared subset for settings page) ---
const I18N = {
    zh: {
        "Settings": "设置",
        "Advanced": "高级",
        "Dashboard": "控制台",
        "Save": "保存",
        "Apply & Restart": "应用并重启",
        "Clear stored value": "清除已存储的值",
        "Configure Headroom runtime knobs. Changes need a restart to apply.": "配置 Headroom 运行时参数。更改需要重启才能生效。",
        "Run this on the host to apply:": "在宿主机上运行以应用:",
        "Restart required to apply: ": "需要重启以应用: ",
        "Saved — no changes to apply.": "已保存 — 无更改需要应用。",
        "Fix the highlighted fields.": "请修正高亮字段。",
        "Saving…": "保存中…",
        "Saved.": "已保存。",
        "Applying…": "应用中…",
        "Restarting…": "重启中…",
        "Waiting for the proxy to come back…": "等待代理恢复…",
        "Applied — proxy restarted.": "已应用 — 代理已重启。",
        "Timed out waiting for the proxy. Check the proxy logs.": "等待代理超时。请检查代理日志。",
        "Save failed: ": "保存失败: ",
        "Apply failed: ": "应用失败: ",
        "Failed to load settings: ": "加载设置失败: ",
        "Managed by the install manifest — change via": "由安装清单管理 — 通过以下方式更改",
        "Overridden by environment variable": "被环境变量覆盖",
        "edits here have no effect until it's unset.": "此处的编辑在取消设置前无效。",
    }
};
function t(key) {
    const lang = localStorage.getItem('headroom-lang') || 'en';
    if (lang === 'en' || !key) return key;
    return (I18N[lang] || {})[key] || key;
}
</script>
</head>
<body class="min-h-screen" x-data="settingsPage()" x-init="init()">
    <!-- Header -->
    <header class="glass-header sticky top-0 z-40 px-5 py-3">
        <div class="max-w-3xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" style="color: var(--color-accent);">
                    <rect x="3" y="4" width="4" height="16" rx="1.5" fill="currentColor" opacity="0.9"/>
                    <rect x="9" y="7" width="4" height="10" rx="1.5" fill="currentColor" opacity="0.65"/>
                    <rect x="15" y="2" width="4" height="20" rx="1.5" fill="currentColor" opacity="0.40"/>
                </svg>
                <h1 class="text-lg font-bold tracking-tight">HEADROOM</h1>
                <span class="text-xs font-mono px-2 py-0.5 rounded-full" style="color: var(--color-text-muted); background: var(--color-surface-alt);" x-text="t('Settings')">Settings</span>
            </div>
            <div class="flex items-center gap-3">
                <select @change="setLang($event.target.value)" x-model="lang"
                        class="text-xs rounded-md px-2 py-1.5 focus:outline-none"
                        style="color: var(--color-text-secondary); background: var(--color-surface); border: 1px solid var(--color-border);">
                    <option value="en">EN</option>
                    <option value="zh">中文</option>
                </select>
                <a href="/dashboard" class="text-sm transition-colors" style="color: var(--color-accent);">
                    &larr; <span x-text="t('Dashboard')">Dashboard</span>
                </a>
            </div>
        </div>
    </header>

    <div class="max-w-3xl mx-auto px-4 py-8">
        <div class="mb-6">
            <h2 class="text-xl font-bold mb-1" x-text="t('Settings')">Settings</h2>
            <p class="text-sm field-help" x-text="t('Configure Headroom runtime knobs. Changes need a restart to apply.')">Configure Headroom runtime knobs. Changes need a restart to apply.</p>
        </div>

        <!-- Status / error surface -->
        <template x-if="loadError">
            <div class="card rounded-lg p-4 mb-4" style="border-color: var(--color-negative);">
                <p class="text-sm" style="color: var(--color-negative);" x-text="loadError"></p>
            </div>
        </template>

        <!-- Restart-required banner -->
        <template x-if="banner">
            <div class="card rounded-lg p-4 mb-4" style="border-color: var(--color-warning);" x-cloak>
                <p class="text-sm font-medium" style="color: var(--color-warning);" x-text="banner"></p>
                <template x-if="applyMode === 'docker' && applyCommand">
                    <div class="mt-2">
                        <p class="text-xs field-help mb-1" x-text="t('Run this on the host to apply:')">Run this on the host to apply:</p>
                        <code class="block text-xs rounded px-3 py-2 select-all font-mono" style="background: var(--color-surface-alt);" x-text="applyCommand"></code>
                    </div>
                </template>
            </div>
        </template>

        <!-- Tier tabs -->
        <div class="flex items-center gap-1 mb-6 p-1 rounded-lg" role="tablist" style="background: var(--color-surface-alt); border: 1px solid var(--color-border);">
            <button type="button" role="tab" @click="activeTab = 'basic'"
                    :aria-selected="activeTab === 'basic'"
                    :class="activeTab === 'basic' ? 'active' : ''"
                    class="tab-btn" x-text="t('Settings')">Settings</button>
            <button type="button" role="tab" @click="activeTab = 'advanced'"
                    :aria-selected="activeTab === 'advanced'"
                    :class="activeTab === 'advanced' ? 'active' : ''"
                    class="tab-btn" x-text="t('Advanced')">Advanced</button>
        </div>

        <!-- Grouped fields -->
        <template x-if="loaded">
            <form @submit.prevent>
                <template x-for="group in groups.filter(g => fieldsIn(g).length > 0)" :key="group">
                    <div class="card rounded-lg p-5 mb-4">
                        <h2 class="text-xs font-semibold uppercase tracking-widest mb-4 field-help" x-text="group"></h2>
                        <template x-for="field in fieldsIn(group)" :key="field.key">
                            <div class="mb-4 last:mb-0">
                                <label class="flex items-center justify-between gap-4">
                                    <span class="text-sm font-medium" x-text="field.label"></span>
                                    <!-- bool -->
                                    <template x-if="field.type === 'bool'">
                                        <input type="checkbox" class="h-5 w-5"
                                               style="accent-color: var(--color-accent);"
                                               :disabled="isLocked(field)"
                                               x-model="values[field.key]">
                                    </template>
                                    <!-- enum -->
                                    <template x-if="field.type === 'enum'">
                                        <select class="rounded px-2 py-1 text-sm w-56"
                                                :disabled="isLocked(field)"
                                                x-model="values[field.key]">
                                            <template x-for="choice in field.choices" :key="choice">
                                                <option :value="choice" x-text="choice"></option>
                                            </template>
                                        </select>
                                    </template>
                                    <!-- int / float -->
                                    <template x-if="field.type === 'int' || field.type === 'float'">
                                        <input type="number" class="rounded px-2 py-1 text-sm w-56"
                                               :step="field.type === 'float' ? 'any' : '1'"
                                               :min="field.minimum" :max="field.maximum"
                                               :disabled="isLocked(field)"
                                               x-model.number="values[field.key]">
                                    </template>
                                    <!-- str / secret / header-map -->
                                    <template x-if="field.type === 'str' || field.type === 'header-map'">
                                        <input :type="field.secret ? 'password' : 'text'"
                                               class="rounded px-2 py-1 text-sm w-56"
                                               :disabled="isLocked(field)"
                                               x-model="values[field.key]"
                                               @input="delete clearedKeys[field.key]">
                                    </template>
                                </label>
                                <template x-if="field.secret && !isLocked(field)">
                                    <button type="button" @click="values[field.key] = ''; clearedKeys[field.key] = true"
                                            class="text-xs hover:underline mt-1" style="color: var(--color-negative);" x-text="t('Clear stored value')">
                                        Clear stored value
                                    </button>
                                </template>
                                <p class="text-xs field-help mt-1" x-text="field.help"></p>
                                <template x-if="field.manifest_managed && manifestManaged">
                                    <p class="text-xs mt-1" style="color: var(--color-warning);">
                                        Managed by the install manifest — change via <code>headroom install</code>.
                                    </p>
                                </template>
                                <template x-if="field.env_override && !(field.manifest_managed && manifestManaged)">
                                    <p class="text-xs mt-1" style="color: var(--color-warning);">
                                        Overridden by environment variable <code x-text="field.env"></code> -- edits here have no effect until it's unset.
                                    </p>
                                </template>
                                <template x-if="fieldErrors[field.key]">
                                    <p class="text-xs mt-1" style="color: var(--color-negative);" x-text="fieldErrors[field.key]"></p>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>

                <div class="flex items-center gap-3 mt-6">
                    <button type="button" @click="save()"
                            :disabled="busy"
                            class="px-4 py-2 rounded text-sm font-medium disabled:opacity-50 transition-colors"
                            style="background: var(--color-surface-alt); color: var(--color-text); border: 1px solid var(--color-border);"
                            x-text="t('Save')">
                        Save
                    </button>
                    <button type="button" @click="applyAndRestart()"
                            :disabled="busy"
                            class="px-4 py-2 rounded text-sm font-medium disabled:opacity-50 transition-colors"
                            style="background: var(--color-accent); color: #fff;"
                            x-text="t('Apply & Restart')">
                        Apply &amp; Restart
                    </button>
                    <span class="text-sm field-help" x-text="status"></span>
                </div>
            </form>
        </template>
    </div>

    <script>
        function settingsPage() {
            return {
                loaded: false,
                loadError: '',
                fields: [],
                groups: [],
                values: {},
                storedValues: {},
                manifestManaged: false,
                fieldErrors: {},
                banner: '',
                status: '',
                busy: false,
                applyMode: '',
                applyCommand: '',
                activeTab: 'basic',
                clearedKeys: {},
                lang: localStorage.getItem('headroom-lang') || 'en',
                t(key) { return t(key); },
                setLang(l) { this.lang = l; localStorage.setItem('headroom-lang', l); },

                async init() {
                    try {
                        const res = await fetch('/settings/schema');
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        const schema = await res.json();
                        this.fields = schema.fields || [];
                        this.groups = schema.groups || [];
                        for (const f of this.fields) {
                            this.values[f.key] = schema.values ? schema.values[f.key] : f.value;
                            this.storedValues[f.key] = f.stored;
                        }
                        this.manifestManaged = !!schema.supervised;
                        this.loaded = true;
                    } catch (e) {
                        this.loadError = t('Failed to load settings: ') + e.message;
                    }
                },

                fieldsIn(group) { return this.fields.filter(f => f.group === group && f.tier === this.activeTab); },

                isLocked(field) { return (!!field.manifest_managed && this.manifestManaged) || !!field.env_override; },

                isEmptyValue(value) { return value === '' || value === null || value === undefined; },

                normalizedComparable(value) {
                    return this.isEmptyValue(value) ? null : value;
                },

                editableValues() {
                    const out = {};
                    for (const f of this.fields) {
                        if (this.isLocked(f)) continue;
                        if (this.clearedKeys[f.key]) { out[f.key] = null; continue; }
                        let v = this.values[f.key];
                        const stored = this.storedValues[f.key];
                        const baseline = this.isEmptyValue(stored) ? f.default : stored;
                        if (this.isEmptyValue(v)) {
                            if (!this.isEmptyValue(stored)) out[f.key] = null;
                            continue;
                        }
                        if (this.normalizedComparable(v) === this.normalizedComparable(baseline)) continue;
                        out[f.key] = v;
                    }
                    return out;
                },

                async save() {
                    this.busy = true; this.status = t('Saving…'); this.fieldErrors = {};
                    try {
                        const res = await fetch('/settings', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ values: this.editableValues() }),
                        });
                        const data = await res.json();
                        if (res.status === 200) {
                            this.status = t('Saved.');
                            const changed = data.changed_keys || [];
                            this.banner = changed.length ? (t('Restart required to apply: ') + changed.join(', ')) : t('Saved — no changes to apply.');
                            this.applyMode = ''; this.applyCommand = '';
                            this.clearedKeys = {};
                        } else if (res.status === 422) {
                            this.fieldErrors = data.field_errors || {};
                            this.status = t('Fix the highlighted fields.');
                        } else {
                            this.status = data.error || ('Error ' + res.status);
                        }
                    } catch (e) {
                        this.status = t('Save failed: ') + e.message;
                    } finally {
                        this.busy = false;
                    }
                },

                async applyAndRestart() {
                    this.busy = true; this.status = t('Applying…'); this.fieldErrors = {};
                    try {
                        const res = await fetch('/settings/apply', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ values: this.editableValues() }),
                        });
                        const data = await res.json();
                        if (res.status === 422) {
                            this.fieldErrors = data.field_errors || {};
                            this.status = t('Fix the highlighted fields.'); return;
                        }
                        if (res.status === 400) {
                            this.status = data.error || 'Bad request'; return;
                        }
                        this.applyMode = data.mode || '';
                        if (data.restarted && data.mode === 'service') {
                            this.banner = t('Restarting…');
                            this.status = t('Waiting for the proxy to come back…');
                            await this.pollHealth();
                        } else if (data.mode === 'docker') {
                            this.applyCommand = data.command || '';
                            this.banner = 'Saved. To apply, run the command on the host:';
                            this.status = '';
                        } else {
                            this.banner = data.instruction || 'Saved. Restart the proxy to apply.';
                            this.status = '';
                        }
                    } catch (e) {
                        this.status = t('Apply failed: ') + e.message;
                    } finally {
                        this.busy = false;
                    }
                },

                async pollHealth() {
                    const deadline = 40;
                    for (let i = 0; i < deadline; i++) {
                        await new Promise(r => setTimeout(r, 1500));
                        try {
                            const res = await fetch('/health', { cache: 'no-store' });
                            if (res.ok) {
                                this.banner = '';
                                this.status = t('Applied — proxy restarted.');
                                return;
                            }
                        } catch (e) { /* proxy still down: keep polling */ }
                    }
                    this.status = t('Timed out waiting for the proxy. Check the proxy logs.');
                },
            };
        }
    </script>
</body>
</html>
